name: Update HackerRank Stats

on:
  schedule:
    - cron: "0 */6 * * *"

  workflow_dispatch:

  push:
    paths:
      - ".github/workflows/hackerrank.yml"

concurrency:
  group: hackerrank-stats
  cancel-in-progress: false

jobs:
  update-hackerrank:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0


      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Update HackerRank statistics
        run: |
          python hackerrank_stats.py

      - name: Track HackerRank activity
        run: |
          python hackerrank_tracker.py

      - name: Generate HackerRank activity graph
        run: |
          python hackerrank_activity.py

      - name: Commit updated statistics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            hackerrank_stats.svg \
            hackerrank_activity.svg \
            activity.json

          git diff --cached --quiet || git commit -m "Update HackerRank statistics"

          - name: Push changes
            run: |
              git push origin HEAD:main

