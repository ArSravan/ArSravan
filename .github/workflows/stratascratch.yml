name: Update StrataScratch Stats

on:
  schedule:
    - cron: "0 */6 * * *"

  workflow_dispatch:

  push:
    paths:
      - ".github/workflows/stratascratch.yml"

concurrency:
  group: stratascratch-activity
  cancel-in-progress: false

jobs:
  update-stratascratch:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0


      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"


      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests


      - name: Track StrataScratch activity
        env:
          STRATASCRATCH_TOKEN: ${{ secrets.STRATASCRATCH_TOKEN }}
        run: |
          python stratascratch_tracker.py

      - name: Generate StrataScratch stats card
        env:
          STRATASCRATCH_TOKEN: ${{ secrets.STRATASCRATCH_TOKEN }}
        run: |
          python stratascratch_stats.py

      - name: Generate StrataScratch activity graph
        run: |
          python stratascratch_activity.py

      - name: Commit updated statistics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            stratascratch_activity.json \
            stratascratch_stats.svg \
            stratascratch_activity.svg

          git diff --cached --quiet || git commit -m "Update StrataScratch statistics"


      - name: Push changes
        run: |
          git push origin HEAD:main
