<svg
    width="850"
    height="220"
    viewBox="0 0 850 220"
    xmlns="http://www.w3.org/2000/svg">

    <rect
        width="850"
        height="220"
        rx="16"
        fill="#0d1117"
        stroke="#30363d"
        stroke-width="1"/>

    <!-- Header -->

    <text
        x="40"
        y="45"
        fill="#f0f6fc"
        font-family="Arial, Helvetica, sans-serif"
        font-size="21"
        font-weight="600">
        HACKERRANK
    </text>

    <text
        x="40"
        y="69"
        fill="#8b949e"
        font-family="Arial, Helvetica, sans-serif"
        font-size="13">
        Python · Problem Solving
    </text>

    <!-- Divider -->

    <line
        x1="40"
        y1="90"
        x2="810"
        y2="90"
        stroke="#21262d"
        stroke-width="1"/>

    <!-- Solved -->

    <text
        x="70"
        y="130"
        fill="#f0f6fc"
        font-family="Arial, Helvetica, sans-serif"
        font-size="26"
        font-weight="600">
        18
    </text>

    <text
        x="70"
        y="153"
        fill="#8b949e"
        font-family="Arial, Helvetica, sans-serif"
        font-size="11"
        letter-spacing="1">
        SOLVED
    </text>

    <!-- Stars -->

    <text
        x="260"
        y="130"
        fill="#d29922"
        font-family="Arial, Helvetica, sans-serif"
        font-size="23">
        ★★★
    </text>

    <text
        x="260"
        y="153"
        fill="#8b949e"
        font-family="Arial, Helvetica, sans-serif"
        font-size="11"
        letter-spacing="1">
        STARS
    </text>

    <!-- Points -->

    <text
        x="470"
        y="130"
        fill="#f0f6fc"
        font-family="Arial, Helvetica, sans-serif"
        font-size="26"
        font-weight="600">
        215
    </text>

    <text
        x="470"
        y="153"
        fill="#8b949e"
        font-family="Arial, Helvetica, sans-serif"
        font-size="11"
        letter-spacing="1">
        POINTS
    </text>

    <!-- Rank -->

    <text
        x="650"
        y="130"
        fill="#f0f6fc"
        font-family="Arial, Helvetica, sans-serif"
        font-size="26"
        font-weight="600">
        #706,085
    </text>

    <text
        x="650"
        y="153"
        fill="#8b949e"
        font-family="Arial, Helvetica, sans-serif"
        font-size="11"
        letter-spacing="1">
        RANK
    </text>

    <!-- Footer -->

    <text
        x="40"
        y="190"
        fill="#6e7681"
        font-family="Arial, Helvetica, sans-serif"
        font-size="11">
        arsravan88
    </text>

    <text
        x="810"
        y="190"
        fill="#58a6ff"
        text-anchor="end"
        font-family="Arial, Helvetica, sans-serif"
        font-size="11">
        VIEW PROFILE ↗
    </text>

</svg>
